<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>xAI Bug Reporter</title>
  <meta name="description" content="Grok skill for official xAI bug reporting — triage, share-link validation, platform collection, and paste-ready Report an issue packages" />
  <meta property="og:title" content="xAI Bug Reporter" />
  <meta property="og:description" content="Triage, share-link validation, platform collection, and paste-ready Report an issue packages." />
  <meta property="og:image" content="https://raw.githubusercontent.com/FineComputer14451/xai-bug-reporter/main/docs/og.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#0c0c0d" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0c0d;
      --fg: #ecece8;
      --muted: #9a9890;
      --subtle: #6f6d67;
      --line: #2a2a2c;
      --raised: #161617;
      --surface: #121213;
      --accent: #ecece8;
      --ok: #9dba8c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: "IBM Plex Sans", system-ui, sans-serif; }
    a { color: inherit; }
    header {
      border-bottom: 1px solid var(--line);
      padding: 1rem 1.25rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .mark { width: 36px; height: 36px; background: var(--raised); border-radius: 8px; display: grid; place-items: center; flex: none; }
    .mark i { display: block; width: 4px; height: 20px; border-radius: 99px; background: var(--fg); }
    h1 { font-family: Syne, sans-serif; font-size: 1.15rem; margin: 0; }
    .sub { color: var(--subtle); font-size: 0.75rem; margin: 0.2rem 0 0; max-width: 42rem; line-height: 1.35; }
    .pill { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0.45rem 0.75rem; }
    .pill.ready { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
    main { display: grid; grid-template-columns: 1fr minmax(280px, 380px); gap: 0; max-width: 72rem; margin: 0 auto; }
    section { padding: 1.25rem; border-bottom: 1px solid var(--line); }
    .n { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--subtle); letter-spacing: 0.12em; }
    h2 { font-size: 0.95rem; margin: 0.15rem 0 0.85rem; font-weight: 600; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .chip {
      min-height: 44px; padding: 0.4rem 0.75rem; border-radius: 8px; border: 1px solid var(--line);
      background: var(--raised); color: var(--fg); cursor: pointer; font: inherit; font-size: 0.85rem;
    }
    .chip:hover { border-color: #4a4a4c; }
    .chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    label { display: block; font-size: 0.72rem; color: var(--muted); margin: 0.7rem 0 0.3rem; }
    input, textarea {
      width: 100%; min-height: 44px; background: var(--raised); color: var(--fg);
      border: 1px solid var(--line); border-radius: 8px; padding: 0.65rem 0.8rem; font: inherit;
    }
    textarea { min-height: 88px; resize: vertical; }
    aside { border-left: 1px solid var(--line); background: var(--surface); padding: 1.25rem; }
    pre {
      white-space: pre-wrap; word-break: break-word; font-family: "IBM Plex Mono", monospace;
      font-size: 12px; line-height: 1.5; color: #d8d6cf; margin: 0.75rem 0 0;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.75rem; }
    .btn {
      min-height: 44px; padding: 0 0.9rem; border-radius: 8px; border: 1px solid var(--line);
      background: var(--raised); color: var(--fg); cursor: pointer; font: inherit; font-size: 0.85rem;
    }
    .btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .sys { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--muted); display: grid; gap: 0.25rem; }
    .sys b { color: var(--subtle); font-weight: 500; min-width: 5.5rem; display: inline-block; }
    .gh { width: 44px; height: 44px; display: grid; place-items: center; color: var(--subtle); border-radius: 8px; }
    .gh:hover { background: var(--raised); color: var(--fg); }
    .missing { color: #d4a27f; font-size: 0.75rem; margin-top: 0.5rem; }
    @media (max-width: 860px) {
      main { grid-template-columns: 1fr; }
      aside { border-left: 0; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;gap:0.75rem;min-width:0;align-items:center">
      <span class="mark" aria-hidden="true"><i></i></span>
      <div>
        <h1>xAI Bug Reporter</h1>
        <p class="sub">Grok skill for official xAI bug reporting — triage, share-link validation, platform collection, and paste-ready Report an issue packages</p>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:0.5rem;flex:none">
      <span class="pill" id="score">0%</span>
      <a class="gh" href="https://github.com/FineComputer14451/xai-bug-reporter" aria-label="GitHub repository">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .3A12 12 0 0 0 8.2 23.7c.6.1.8-.3.8-.6v-2.1c-3.3.7-4-1.6-4-1.6-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.7 18.3 5 18.3 5c.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.7-2.8 5.7-5.5 6 .4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6A12 12 0 0 0 12 .3Z"/></svg>
      </a>
    </div>
  </header>
  <main>
    <div>
      <section>
        <div class="n">01</div>
        <h2>What broke</h2>
        <div class="chips" id="products"></div>
      </section>
      <section>
        <div class="n">02</div>
        <h2>Severity · frequency · platform</h2>
        <div class="chips" id="severities"></div>
        <label>How often</label>
        <div class="chips" id="frequencies"></div>
        <label>Where</label>
        <div class="chips" id="platforms"></div>
      </section>
      <section>
        <div class="n">03</div>
        <h2>You</h2>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@domain.com" />
        <label>Subscription</label>
        <div class="chips" id="tiers"></div>
        <label>System</label>
        <div class="sys" id="sys"></div>
      </section>
      <section>
        <div class="n">04</div>
        <h2>Write it up</h2>
        <label for="title">Summary</label>
        <input id="title" maxlength="140" placeholder="One-line description" />
        <label for="actual">What happened</label>
        <textarea id="actual" placeholder="What you saw"></textarea>
        <label for="expected">What should happen</label>
        <textarea id="expected" placeholder="Expected result"></textarea>
        <label for="steps">Steps to reproduce</label>
        <textarea id="steps" placeholder="1. …"></textarea>
        <label for="share">Share link (optional)</label>
        <input id="share" placeholder="https://grok.com/share/…" />
      </section>
    </div>
    <aside>
      <div class="n">Live report</div>
      <h2>Paste-ready package</h2>
      <div class="missing" id="missing"></div>
      <div class="actions">
        <button class="btn primary" id="copy" type="button">Copy</button>
        <button class="btn" id="mail" type="button">Email</button>
        <button class="btn" id="dl" type="button">Download .txt</button>
      </div>
      <pre id="out"></pre>
    </aside>
  </main>
  <script>
    const PRODUCTS = [
      ["grok-chat","Grok Chat"],["imagine","Imagine"],["grok-x","Grok on X"],["api","API"],
      ["ios","iOS app"],["android","Android app"],["voice","Voice"],["tesla","Tesla"],
      ["billing","Billing"],["safety","Safety"],["other","Other"]
    ];
    const SEVERITIES = [["blocker","Blocker"],["high","High"],["medium","Medium"],["low","Low"]];
    const FREQS = [["always","Always"],["often","Often"],["once","Once"],["unknown","Unknown"]];
    const PLATS = [["web","Web"],["ios","iOS"],["android","Android"],["api","API"],["tesla","Tesla"],["other","Other"]];
    const TIERS = [["free","Free"],["super-grok","SuperGrok"],["super-grok-pro","SuperGrok Pro"],["x-premium","X Premium"],["x-premium-plus","Premium+"],["api","API / Enterprise"],["unknown","Not sure"]];
    const INBOX = { safety: "safety@x.ai" };
    const state = { product: "", severity: "", frequency: "", platform: "", subscription: "" };

    function uaParse() {
      const ua = navigator.userAgent || "";
      let browser = "Unknown";
      if (/Edg\//.test(ua)) browser = "Edge";
      else if (/Chrome\//.test(ua)) browser = "Chrome";
      else if (/Safari\//.test(ua) && !/Chrome/.test(ua)) browser = "Safari";
      else if (/Firefox\//.test(ua)) browser = "Firefox";
      let os = "Unknown";
      if (/Windows/.test(ua)) os = "Windows";
      else if (/Mac OS X/.test(ua)) os = "macOS";
      else if (/Android/.test(ua)) os = "Android";
      else if (/iPhone|iPad/.test(ua)) os = "iOS";
      else if (/Linux/.test(ua)) os = "Linux";
      return {
        browser, os,
        screen: `${screen.width}×${screen.height}`,
        viewport: `${innerWidth}×${innerHeight}`,
        language: navigator.language || "—",
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "—",
        userAgent: ua
      };
    }
    const sys = uaParse();
    document.getElementById("sys").innerHTML = [
      ["Browser", sys.browser],["OS", sys.os],["Screen", sys.screen],
      ["Viewport", sys.viewport],["Language", sys.language],["Timezone", sys.timezone]
    ].map(([k,v]) => `<div><b>${k}</b> ${v}</div>`).join("");

    function chips(el, items, key) {
      el.innerHTML = items.map(([id,label]) => `<button type="button" class="chip" data-id="${id}">${label}</button>`).join("");
      el.addEventListener("click", (e) => {
        const b = e.target.closest(".chip"); if (!b) return;
        state[key] = b.dataset.id;
        [...el.children].forEach(c => c.classList.toggle("on", c.dataset.id === state[key]));
        render();
      });
    }
    chips(document.getElementById("products"), PRODUCTS, "product");
    chips(document.getElementById("severities"), SEVERITIES, "severity");
    chips(document.getElementById("frequencies"), FREQS, "frequency");
    chips(document.getElementById("platforms"), PLATS, "platform");
    chips(document.getElementById("tiers"), TIERS, "subscription");

    const $ = (id) => document.getElementById(id);
    ["email","title","actual","expected","steps","share"].forEach(id => $(id).addEventListener("input", render));

    function lab(list, id) { return (list.find(x => x[0] === id) || [,"—"])[1]; }
    function val(id) { return $(id).value.trim(); }
    function emailOk(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

    function format() {
      const date = new Date().toISOString().slice(0,10);
      const product = lab(PRODUCTS, state.product);
      const inbox = INBOX[state.product] || "support@x.ai";
      return [
        "INCIDENT REPORT","===============",`Filed via xAI Bug Reporter · ${date}`,"",
        "Reporter","--------",
        `Email:       ${val("email") || "—"}`,`Plan:        ${lab(TIERS, state.subscription)}`,"",
        "Incident","--------",
        `Product:     ${product}`,`Severity:    ${lab(SEVERITIES, state.severity)}`,
        `Platform:    ${lab(PLATS, state.platform)}`,`Frequency:   ${lab(FREQS, state.frequency)}`,
        `Inbox:       ${inbox}`,"",
        "Summary","-------", val("title") || "—","",
        "Steps to reproduce","------------------", val("steps") || "—","",
        "Expected","--------", val("expected") || "—","",
        "Actual","------", val("actual") || "—","",
        "Evidence","--------", `Share link:  ${val("share") || "—"}`,"",
        "System","------",
        `Browser:     ${sys.browser}`,`OS:          ${sys.os}`,
        `Screen:      ${sys.screen}`,`Viewport:    ${sys.viewport}`,
        `Language:    ${sys.language}`,`Timezone:    ${sys.timezone}`,
        `User-Agent:  ${sys.userAgent}`,"",
        "-----BEGIN REPORT-----",
        "=== TRIAGE ===",
        `Severity: ${lab(SEVERITIES, state.severity)}`,
        `Category: ${product}`,
        `Impact: ${val("actual") || "—"}`,"",
        "=== REQUIRED ===",
        `Account email: ${val("email") || "—"}`,
        `Subscription tier: ${lab(TIERS, state.subscription)}`,
        `Platform: ${lab(PLATS, state.platform)}`,
        `System & app info: ${sys.os}; ${sys.browser}; ${sys.screen}`,
        `Bug description: ${val("actual") || "—"}`,
        `Steps to reproduce: ${val("steps") || "—"}`,"",
        "Evidence:",
        `  Conversation share link: ${val("share") || "—"}`,
        "  Screenshot: —","","=== NOTES ===",
        `Frequency: ${lab(FREQS, state.frequency)}`,
        "Reported from inside the chat where the bug occurred: —",
        "-----END REPORT-----"
      ].join("\n");
    }

    function render() {
      const missing = [];
      if (!state.product) missing.push("Product");
      if (!state.severity) missing.push("Severity");
      if (!state.platform) missing.push("Platform");
      if (!emailOk(val("email"))) missing.push("Email");
      if (!state.subscription) missing.push("Plan");
      if (val("title").length < 8) missing.push("Summary");
      if (val("steps").length < 16) missing.push("Steps");
      if (val("actual").length < 8) missing.push("What happened");
      const pct = Math.round(((8 - missing.length) / 8) * 100);
      const pill = $("score");
      pill.textContent = `${pct}%`;
      pill.classList.toggle("ready", pct === 100);
      $("missing").textContent = missing.length ? "Still need: " + missing.join(", ") : "Ready to copy.";
      $("out").textContent = format();
    }

    $("copy").onclick = async () => {
      await navigator.clipboard.writeText(format());
      $("copy").textContent = "Copied";
      setTimeout(() => $("copy").textContent = "Copy", 1200);
    };
    $("mail").onclick = () => {
      const inbox = INBOX[state.product] || "support@x.ai";
      const sub = encodeURIComponent("[xAI Bug Reporter] " + (val("title") || "Incident"));
      location.href = `mailto:${inbox}?subject=${sub}&body=${encodeURIComponent(format())}`;
    };
    $("dl").onclick = () => {
      const blob = new Blob([format()], { type: "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "xai-bug-report.txt";
      a.click();
    };
    render();
  </script>
</body>
</html>
